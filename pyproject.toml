[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omadex"
version = "1.0.5"
description = "Contact aggregator for Omarchy: one address layer over many address books"
requires-python = ">=3.12"
license = "MIT"
# PyGObject is deliberately absent: the wallet is reached through the system
# gobject bindings, which pip cannot usefully install alongside them.
dependencies = ["cryptography"]

[project.scripts]
omadex = "omadex.cli:main"
omadexd = "omadex.daemon:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 92

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
